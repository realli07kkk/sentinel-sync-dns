sentinel:
  name: sentinel-1
  host: 1.2.3.4:26379,1.2.3.5:26379
  password: 
  master_name:
    - codis-demo-1
    - master-sg1

# 默认单机模式，下面 cluster 不配置或 enabled=false 时，行为与旧版本一致。
# cluster:
#   enabled: true
#   namespace: sentinel-sync-dns
#   node_name: sentinel-sync-dns-01
#   lock_ttl: 15s
#   event_ttl: 60s
#   renew_interval: 5s
#   redis:
#     addr: 127.0.0.1:6379
#     password: ""
#     db: 0

dns-providers:
  - name: huaweicloud-private-1
    type: huaweicloud-private
    domain: demo.com
    zone_id: id
    request_timeout: 30s
    record:
      - type: A
        ttl: 1
    huaweicloud:
      access_key: xxx
      secret_key: xxx
      region: cn-east-3
  
  - name: tencentcloud-private-1
    type: tencentcloud-private
    domain: demo.com
    zone_id: id
    request_timeout: 30s
    record:
      - type: A
        ttl: 300
    tencentcloud:
      secretId: xxx
      secretKey: xxx

  - name: alicloud-private-1
    type: alicloud-private
    domain: demo.com
    zone_id: id
    request_timeout: 30s
    record:
      # 阿里云 PrivateZone TTL 仅支持 5/30/60/3600/43200/86400
      - type: A
        ttl: 60
    alicloud:
      access_key: xxx
      secret_key: xxx

  - name: aws-private-1
    type: aws-private
    domain: demo.com
    zone_id: Z0123456789ABCDEFGHIJ
    request_timeout: 30s
    record:
      - type: A
        ttl: 60
    aws:
      # access_key/secret_key 可省略，省略时使用 AWS 默认凭证链（环境变量、实例角色等）
      access_key: xxx
      secret_key: xxx
      # session_token: xxx
      # region 仅用于 SDK 端点解析，Route53 为全局服务，默认 us-east-1
      region: us-east-1
