sentinel:
  name: sentinel-1
  host: 1.2.3.4:26379,1.2.3.5:26379
  password: 
  master_name:
    - codis-demo-1
    - master-sg1

# 默认单机模式，下面 cluster 不配置或 enabled=false 时，行为与旧版本一致。
# cluster:
#   enabled: true
#   namespace: sentinel-sync-dns
#   node_name: sentinel-sync-dns-01
