#   event_ttl: 60s
#   renew_interval: 5s
#   redis:
#     addr: 127.0.0.1:6379
#     password: ""
#     db: 0

dns-providers:
  - name: huaweicloud-private-1
    type: huaweicloud-private
    domain: demo.com
    zone_id: id
    request_timeout: 30s
    record:
      - type: A
        ttl: 1
    huaweicloud:
      access_key: xxx
      secret_key: xxx
      region: cn-east-3
  
  - name: tencentcloud-private-1
    type: tencentcloud-private
    domain: demo.com
    zone_id: id
    request_timeout: 30s
    record:
      - type: A
        ttl: 300
    tencentcloud:
      secretId: xxx
      secretKey: xxx
